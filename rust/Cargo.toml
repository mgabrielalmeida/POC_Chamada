[package]
name = "chamada"
version = "0.1.0"
edition = "2024"
publish = false
description = "Camada técnica da POC de chamada para Windows"

[lib]
# A biblioteca dinâmica será consumida pelo Flutter-Rust Bridge.
crate-type = ["cdylib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
rand = "0.9"
rtc = { version = "=0.21.1", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-native-roots"] }
webrtc = "=0.21.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[dev-dependencies]
sinalizacao = { path = "../servidor" }
