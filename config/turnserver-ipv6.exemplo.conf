# coturn 4.18.0 nativo Windows. Copiar para fora do Git e preencher.
# IPv6 global atribuído à placa do Windows S, sem colchetes ou /prefixo.
listening-port=3478
listening-ip=IPV6_GLOBAL_DO_WINDOWS_S
relay-ip=IPV6_GLOBAL_DO_WINDOWS_S
# rtc-turn 0.21.1 não envia REQUESTED-ADDRESS-FAMILY. Nesta implantação IPv6:
allocation-default-address-family=ipv6
# Não usar external-ip: não há mapeamento NAT neste endereço global.
fingerprint
lt-cred-mech
realm=chamada-poc
user=USUARIO_TURN:SENHA_ALEATORIA_TURN
min-port=49160
max-port=49200
user-quota=8
total-quota=16
no-tcp
no-tls
no-tcp-relay
no-multicast-peers
# Restringir destinos não públicos; formato de intervalos aceito pelo coturn.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# Não adicionar denied-peer-ip=:: ou =0.0.0.0: coturn os interpreta como
# limites curinga e pode bloquear todos os peers. good_peer_addr já rejeita
# endereços não especificados; loopback continua proibido por padrão.
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Não habilitar no-auth, cli, web-admin, dtls, server-relay ou allow-loopback-peers.
log-file=stdout
